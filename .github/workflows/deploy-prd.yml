name: Build and Update GitOps (PRD)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: prd-gitops
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/five-road/muppin-landing
  IMAGE_TAG: prd-${{ github.run_number }}-${{ github.sha }}
  OVERLAY_PATH: deploy/k8s/overlays/prd/kustomization.yaml

jobs:
  build-and-update-gitops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:prd-latest
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update GitOps image tag
        shell: bash
        run: |
          sed -i "s|newName: .*|newName: ${IMAGE_NAME}|" "$OVERLAY_PATH"
          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|" "$OVERLAY_PATH"

          if git diff --quiet -- "$OVERLAY_PATH"; then
            echo "No GitOps manifest changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OVERLAY_PATH"
          git commit -m "chore(gitops): update prd image to ${IMAGE_TAG}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
