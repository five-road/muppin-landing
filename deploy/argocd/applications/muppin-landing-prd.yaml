apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: muppin-landing-prd
  namespace: argocd
spec:
  project: muppin
  source:
    repoURL: https://github.com/five-road/muppin-landing.git
    targetRevision: main
    path: deploy/k8s/overlays/prd
  destination:
    server: https://kubernetes.default.svc
    namespace: prd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
