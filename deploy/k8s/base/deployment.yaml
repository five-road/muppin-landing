apiVersion: apps/v1
kind: Deployment
metadata:
  name: muppin-landing
  labels:
    app.kubernetes.io/name: muppin-landing
    app.kubernetes.io/part-of: muppin
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: muppin-landing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: muppin-landing
        app.kubernetes.io/part-of: muppin
    spec:
      containers:
        - name: muppin-landing
          image: muppin-landing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
