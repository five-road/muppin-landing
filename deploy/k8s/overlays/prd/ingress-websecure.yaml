apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: muppin-landing-websecure
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: landing.muppin.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: muppin-landing
                port:
                  number: 80
